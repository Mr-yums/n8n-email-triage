[package]
name = "triage-gateway"
version = "0.1.0"
edition = "2024"
description = "Passerelle IA du tri d'emails : règles déterministes, Jev (décision typée), Claude (arbitrage). Mode démo sans clé."
license = "MIT"
publish = false

[[bin]]
name = "triage-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-postgres = "0.7.18"

[profile.release]
strip = true
